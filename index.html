<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Split-Flap Airport Display</title>
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --muted: #a3a3a3;      /* 7.9:1 on --bg */
            --faint: #8a8a8a;
            --panel: rgba(255, 255, 255, 0.04);
            --glow: 0 0 10px rgba(255, 255, 255, 0.3);
            --btn-bg: #fff;
            --btn-fg: #000;
            --btn2-bg: #262626;
            --focus: #ffd60a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f4f1ea;
                --fg: #111;
                --muted: #555;
                --faint: #666;
                --panel: rgba(0, 0, 0, 0.04);
                --glow: none;
                --btn-bg: #111;
                --btn-fg: #fff;
                --btn2-bg: #e4e0d6;
                --focus: #0050d0;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', ui-monospace, monospace;
            min-height: 100vh;
            min-height: 100dvh;
        }

        #root {
            min-height: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 4vw, 40px);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: clamp(16px, 3vw, 30px);
        }

        .empty-state {
            text-align: center;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            color: var(--muted);
            padding: 24px 0;
        }

        .flights {
            display: flex;
            flex-direction: column;
            gap: clamp(16px, 3vw, 30px);
            list-style: none;
        }

        .flight-row {
            display: grid;
            grid-template-columns: 24px minmax(0, 1.4fr) repeat(3, minmax(0, 1fr));
            align-items: center;
            gap: 8px clamp(8px, 2vw, 20px);
            border-top: 2px solid var(--fg);
            border-bottom: 2px solid var(--fg);
            padding: clamp(12px, 2.5vw, 20px) clamp(12px, 3vw, 30px);
            background: var(--panel);
        }

        .plane-icon { width: 24px; height: 24px; }
        .plane-icon svg { width: 100%; height: 100%; transition: transform 0.3s ease-out; }
        .plane-icon path { fill: var(--fg); stroke: var(--fg); stroke-width: 0.5; }

        .segment {
            display: block;
            text-align: center;
            font-size: clamp(1.15rem, 5vw, 2rem);
            font-weight: bold;
            text-shadow: var(--glow);
            overflow-wrap: anywhere;
        }

        .segment.callsign { text-align: left; letter-spacing: 0.04em; }

        .data-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .data-label-text { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
        .data-label-unit { font-size: 0.75rem; color: var(--faint); margin-top: 4px; }

        /* Flip animation: the .flip class is toggled when a row's data changes. */
        .segment.flip { animation: flip 0.4s ease-out; }
        @keyframes flip {
            from { transform: rotateX(90deg); opacity: 0; }
            to   { transform: rotateX(0);     opacity: 1; }
        }

        /* Phones: callsign on top, three readouts underneath. */
        @media (max-width: 560px) {
            .flight-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .plane-icon { justify-self: center; }
            .segment.callsign { grid-column: 2 / -1; }
        }

        .button-group {
            margin-top: clamp(12px, 4vw, 40px);
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            min-height: 44px;           /* comfortable touch target */
            font: bold 1rem 'Courier New', ui-monospace, monospace;
            border: 1px solid var(--fg);
            border-radius: 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-add   { background: var(--btn-bg);  color: var(--btn-fg); }
        .btn-clear { background: var(--btn2-bg); color: var(--fg); }

        :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

        .instructions {
            font-size: 0.9rem;
            color: var(--muted);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .instructions p { margin: 5px 0; }
        .instructions code { color: var(--fg); overflow-wrap: anywhere; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap;
        }

        @media (prefers-reduced-motion: reduce) {
            .segment.flip { animation: none; }
            .plane-icon svg { transition: none; }
        }
    </style>
</head>
<body>
    <main id="root" aria-label="Aircraft overhead"></main>

    <script>
        // ---- Configuration ------------------------------------------------
        const MAX_FLIGHTS = 2;               // how many rows to show (newest win)

        // Each readout is one entry here; add a field and it appears in every row.
        // `key` is the property name on a flight object, `format` turns the raw
        // value into display text.
        const FIELDS = [
            { key: 'altitude', label: 'ALT',  unit: 'ft', format: v => Math.round(v).toLocaleString() },
            { key: 'distance', label: 'DIST', unit: '',   format: v => v < 1 ? `${Math.round(v * 1000)}m` : `${v.toFixed(1)}km` },
            { key: 'heading',  label: 'HDG',  unit: '',   format: v => `${Math.round(v)}°` },
        ];

        // ---- State ----------------------------------------------------------
        let flights = [];
        let nextId = 1;

        function num(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n : 0;
        }

        // ---- Public API (call from Home Assistant, a bookmarklet, the console)
        function addFlight(data) {
            if (!data || typeof data !== 'object') return;
            flights = [...flights, { ...data, id: nextId++ }].slice(-MAX_FLIGHTS);
            render();
        }
        function setFlights(list) {
            flights = (Array.isArray(list) ? list : []).slice(-MAX_FLIGHTS)
                .map(f => ({ ...f, id: nextId++ }));
            render();
        }
        function clearFlights() {
            flights = [];
            render();
        }

        function addRandomFlight() {
            const prefixes = ['QF', 'JQ', 'VA', 'BA', 'UA', 'NH', 'SQ'];
            addFlight({
                callsign: prefixes[Math.floor(Math.random() * prefixes.length)] + Math.floor(Math.random() * 9000 + 1000),
                altitude: Math.random() * 35000 + 1000,
                distance: Math.random() * 5,
                heading: Math.random() * 360,
            });
        }

        // ---- Rendering ------------------------------------------------------
        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function createPlaneIcon(heading) {
            const NS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('aria-hidden', 'true');
            svg.style.transform = `rotate(${heading}deg)`;
            const path = document.createElementNS(NS, 'path');
            path.setAttribute('d', 'M12 2L4 22h6l2-6 2 6h6L12 2z');
            svg.appendChild(path);
            return svg;
        }

        function createRow(flight) {
            const li = el('li', 'flight-row');
            const heading = num(flight.heading);
            const callsign = flight.callsign || '-----';

            // Spoken summary for screen readers; the visual cells are hidden from them.
            const summary = `${callsign}, ` + FIELDS.map(f =>
                `${f.label} ${f.format(num(flight[f.key]))}${f.unit ? ' ' + f.unit : ''}`).join(', ');
            li.appendChild(el('span', 'sr-only', summary));

            const visual = document.createDocumentFragment();
            const icon = el('div', 'plane-icon');
            icon.appendChild(createPlaneIcon(heading));
            visual.appendChild(icon);
            visual.appendChild(el('span', 'segment callsign flip', callsign));

            FIELDS.forEach(f => {
                const cell = el('div', 'data-label');
                cell.appendChild(el('span', 'data-label-text', f.label));
                cell.appendChild(el('span', 'segment flip', f.format(num(flight[f.key]))));
                if (f.unit) cell.appendChild(el('span', 'data-label-unit', f.unit));
                visual.appendChild(cell);
            });

            const wrap = el('div');
            wrap.style.display = 'contents';
            wrap.setAttribute('aria-hidden', 'true');
            wrap.appendChild(visual);
            li.appendChild(wrap);
            return li;
        }

        function render() {
            const root = document.getElementById('root');
            root.replaceChildren();

            const container = el('div', 'container');

            // Live region so screen readers announce arrivals.
            const live = el('div');
            live.setAttribute('role', 'status');
            live.setAttribute('aria-live', 'polite');
            if (flights.length === 0) {
                live.className = 'empty-state';
                live.textContent = 'Waiting for aircraft...';
                container.appendChild(live);
            } else {
                const list = el('ul', 'flights');
                flights.forEach(f => list.appendChild(createRow(f)));
                container.appendChild(list);
            }

            const buttons = el('div', 'button-group');
            const addBtn = el('button', 'btn-add', '+ Add Flight (Demo)');
            addBtn.type = 'button';
            addBtn.addEventListener('click', addRandomFlight);
            const clearBtn = el('button', 'btn-clear', 'Clear');
            clearBtn.type = 'button';
            clearBtn.addEventListener('click', clearFlights);
            buttons.append(addBtn, clearBtn);
            container.appendChild(buttons);

            const info = el('div', 'instructions');
            info.innerHTML = `
                <p>To integrate with Home Assistant, call:</p>
                <p><code>window.addFlight({ callsign, altitude, distance, heading })</code></p>
                <p>altitude in feet, distance in km, heading in degrees.</p>`;
            container.appendChild(info);

            root.appendChild(container);
        }

        window.addFlight = addFlight;
        window.setFlights = setFlights;
        window.clearFlights = clearFlights;

        // Same-origin or embedding pages can also push data with postMessage:
        //   frame.contentWindow.postMessage({ flights: [{callsign:'QF1', altitude:30000, distance:2, heading:90}] }, '*')
        // Only plain data is read; nothing is evaluated.
        window.addEventListener('message', e => {
            if (e.data && Array.isArray(e.data.flights)) setFlights(e.data.flights);
        });

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
